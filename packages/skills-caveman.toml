# Agent skills from github.com/JuliusBrussee/caveman, following its main branch.
# oku.lock records the commit, so every machine links the same files.
# `oku update skills-caveman` takes the newest commit.

[package]
name = "skills-caveman"
description = "Agent skills from the JuliusBrussee/caveman repo"
homepage = "https://github.com/JuliusBrussee/caveman"

[version]
from = "git-branch"
repo = "https://github.com/JuliusBrussee/caveman"
branch = "main"

# The package only holds files. lists/ai.toml links the skills out of it.
[build]
needs = ["git"]
source = { git = "https://github.com/JuliusBrussee/caveman", tag = "{{tag}}" }

[[build.step]]
run = """
set -eu
rm -rf .git
cp -R . {{prefix}}
"""
shell = "sh"
