[package]
name = "libwebp"
description = "WebP tools, cwebp and dwebp among them"
homepage = "https://developers.google.com/speed/webp"
license = "BSD-3-Clause"

# Versions come from the tags of the GitHub mirror, the downloads from the
# WebM project bucket. Upstream publishes a PGP signature and no checksum file.
[version]
from = "git-tags"
repo = "https://github.com/webmproject/libwebp"
strip_prefix = "v"

[[artifact]]
match = { os = "darwin", arch = "arm64" }
url = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-{{version}}-mac-arm64.tar.gz"
strip = 1
bin = ["bin/cwebp", "bin/dwebp", "bin/gif2webp", "bin/img2webp", "bin/webpinfo", "bin/webpmux"]

[[artifact]]
match = { os = "linux", arch = "arm64" }
url = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-{{version}}-linux-aarch64.tar.gz"
strip = 1
bin = ["bin/cwebp", "bin/dwebp", "bin/gif2webp", "bin/img2webp", "bin/webpinfo", "bin/webpmux"]

[[artifact]]
match = { os = "linux", arch = "amd64" }
url = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-{{version}}-linux-x86-64.tar.gz"
strip = 1
bin = ["bin/cwebp", "bin/dwebp", "bin/gif2webp", "bin/img2webp", "bin/webpinfo", "bin/webpmux"]
