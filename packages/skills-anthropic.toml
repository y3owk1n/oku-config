# Agent skills from github.com/anthropics/skills, following its main branch.
# oku.lock records the commit, so every machine links the same files.
# `oku update skills-anthropic` takes the newest commit.

[package]
name = "skills-anthropic"
description = "Agent skills from the anthropics/skills repo"
homepage = "https://github.com/anthropics/skills"

[version]
from = "git-branch"
repo = "https://github.com/anthropics/skills"
branch = "main"

# The package only holds files. lists/ai.toml links the skills out of it.
[build]
needs = ["git"]
source = { git = "https://github.com/anthropics/skills", tag = "{{tag}}" }

[[build.step]]
run = """
set -eu
rm -rf .git
cp -R . {{prefix}}
"""
shell = "sh"
