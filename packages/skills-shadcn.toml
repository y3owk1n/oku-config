# Agent skills from github.com/shadcn-ui/ui, following its main branch.
# oku.lock records the commit, so every machine links the same files.
# `oku update skills-shadcn` takes the newest commit.

[package]
name = "skills-shadcn"
description = "Agent skills from the shadcn-ui/ui repo"
homepage = "https://github.com/shadcn-ui/ui"

[version]
from = "git-branch"
repo = "https://github.com/shadcn-ui/ui"
branch = "main"

# The package only holds files. lists/ai.toml links the skills out of it.
[build]
needs = ["git"]
source = { git = "https://github.com/shadcn-ui/ui", tag = "{{tag}}" }

[[build.step]]
run = """
set -eu
rm -rf .git
cp -R . {{prefix}}
"""
shell = "sh"
