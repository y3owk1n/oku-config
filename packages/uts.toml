[package]
name = "uts"
description = "Compress, convert and inspect media files with one command pattern"
homepage = "https://github.com/y3owk1n/uts"
license = "MIT"

# Built from main, before a release. `oku update uts` takes the newest commit.
[version]
from = "git-branch"
repo = "https://github.com/y3owk1n/uts"
branch = "main"

# What the build needs of the machine, which oku checks and does not install.
# The Command Line Tools give macOS its compiler, make and git. On Linux
# bootstrap/linux.sh installs these packages.
[host]
xcode-clt = { path = "/Library/Developer/CommandLineTools/usr/bin/clang", install = "xcode-select --install", when = { os = "darwin" } }
git = { command = "git", apt = "git", dnf = "git", pacman = "git", when = { os = "linux" } }

[build]
needs = ["git"]
deps = [{ ref = "./go.toml", version = "~1.26" }]
source = { git = "https://github.com/y3owk1n/uts", tag = "{{tag}}" }

[[build.step]]
vendor = "go"

[[build.step]]
run = """
set -eu
go build -mod=vendor -trimpath -ldflags="-s -w -X github.com/y3owk1n/uts/cmd.Version={{version}}" -o uts ./main.go
mkdir -p man
go run -mod=vendor ./cmd/genman man
"""
shell = "sh"
env = { CGO_ENABLED = "0", GOFLAGS = "-buildvcs=false" }

[[build.step]]
install = { bin = ["uts"], man = ["man/uts.1"], completions = { generate = "./uts completion {{shell}}" } }
