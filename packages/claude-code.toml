[package]
name = "claude-code"
description = "Terminal-based AI coding assistant"
homepage = "https://claude.com/product/claude-code"

[version]
from = "page"
repo = "https://downloads.claude.ai/claude-code-releases/stable"
regex = "(?i)^v?(\\d+(?:\\.\\d+)+)$"

[[artifact]]
match = { os = "darwin", arch = "arm64" }
url = "https://downloads.claude.ai/claude-code-releases/{{version}}/darwin-arm64/claude"
bin = ["claude"]

[[artifact]]
match = { os = "darwin", arch = "amd64" }
url = "https://downloads.claude.ai/claude-code-releases/{{version}}/darwin-x64/claude"
bin = ["claude"]

[[artifact]]
match = { os = "linux", arch = "arm64", libc = "glibc" }
url = "https://downloads.claude.ai/claude-code-releases/{{version}}/linux-arm64/claude"
bin = ["claude"]

[[artifact]]
match = { os = "linux", arch = "amd64", libc = "glibc" }
url = "https://downloads.claude.ai/claude-code-releases/{{version}}/linux-x64/claude"
bin = ["claude"]
