[package]
name = "fontconfig"
description = "Library that finds and configures fonts, with fc-list and fc-match"
homepage = "https://www.freedesktop.org/wiki/Software/fontconfig/"
license = "MIT"

# Newer releases build with meson alone. 2.15.0 is the last archive that holds
# a configure script, so the version is fixed on purpose.
[version]
value = "2.15.0"

# What the build needs of the machine, which oku checks and does not install.
# The Command Line Tools give macOS its compiler, make and git. On Linux
# bootstrap/linux.sh installs these packages.
[host]
xcode-clt = { path = "/Library/Developer/CommandLineTools/usr/bin/clang", install = "xcode-select --install", when = { os = "darwin" } }
cc = { command = "cc", apt = "build-essential", dnf = "gcc-c++", pacman = "base-devel", when = { os = "linux" } }
make = { command = "make", apt = "build-essential", dnf = "make", pacman = "base-devel", when = { os = "linux" } }
gperf = { command = "gperf", apt = "gperf", dnf = "gperf", pacman = "gperf", when = { os = "linux" } }
python3 = { command = "python3", apt = "python3", dnf = "python3", pacman = "python", when = { os = "linux" } }
expat = { apt = "libexpat1-dev", dnf = "expat-devel", pacman = "expat", when = { os = "linux" } }

[build]
needs = ["cc", "make", "gperf", "python3"]
source = { url = "https://www.freedesktop.org/software/fontconfig/release/fontconfig-{{version}}.tar.xz", sha256 = "63a0658d0e06e0fa886106452b58ef04f21f58202ea02a94c39de0d3335d7c0e", strip = 1 }
deps = ["./pkgconf.toml", "./freetype.toml", { ref = "./libpng.toml", version = "~1.6" }]
when = [{ os = "darwin" }, { os = "linux" }]

[runtime]
deps = ["./freetype.toml", { ref = "./libpng.toml", version = "~1.6" }]

# expat comes from the system, and configure finds it and freetype through
# pkg-config. The font directories are those of macOS. The store is read-only,
# so the cache that matters is the one in the user's home, and make install
# must not fill a cache inside the sandbox.
[[build.step]]
run = """
./configure --prefix={{prefix}} --disable-silent-rules --disable-dependency-tracking --disable-docs --disable-nls \
  --disable-static --sysconfdir={{prefix}}/etc --localstatedir={{prefix}}/var \
  --with-add-fonts=/System/Library/Fonts,/Library/Fonts,~/Library/Fonts
make -j{{jobs}}
make install RUN_FC_CACHE_TEST=false
"""
shell = "sh"
