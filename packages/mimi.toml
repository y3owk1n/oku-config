[package]
name = "mimi"
description = "Window and space utility daemon for macOS"
homepage = "https://github.com/y3owk1n/mimi"
license = "MIT"

# Built from main, before a release. `oku update mimi` takes the newest commit.
[version]
from = "git-branch"
repo = "https://github.com/y3owk1n/mimi"
branch = "main"

[build]
needs = ["git", "cc"]
deps = [{ ref = "./go.toml", version = ">=1.26, <1.27" }]
source = { git = "https://github.com/y3owk1n/mimi", tag = "{{tag}}" }

[[build.step]]
vendor = "go"

[[build.step]]
run = """
set -eu
go build -mod=vendor -trimpath -ldflags="-s -w -X github.com/y3owk1n/mimi/cmd/mimi/cmd.Version={{version}}" -o mimi ./cmd/mimi
mkdir -p man
go run -mod=vendor ./cmd/genman man
"""
shell = "sh"
env = { CGO_ENABLED = "1", GOFLAGS = "-buildvcs=false" }

[[build.step]]
run = """
set -eu
v={{version}}
app=Mimi.app
mkdir -p $app/Contents/MacOS $app/Contents/Resources
cp mimi $app/Contents/MacOS/mimi
cp resources/Mimi.entitlements $app/Contents/Resources/
sed -e "s/BUNDLE_VERSION/${v%%-*}/g" -e "s/SHORT_VERSION/${v%%-*}/g" -e 's/BUILD_ID/{{version}}/g' resources/Info.plist.template > $app/Contents/Info.plist
codesign --force --deep --sign - --entitlements resources/Mimi.entitlements --options runtime $app
"""
shell = "sh"

[[build.step]]
install = { bin = ["mimi"], man = ["man/mimi.1"], completions = { generate = "./mimi completion {{shell}}" } }

# The bundle goes to ~/Applications too, so macOS lists it under Accessibility
# by name and Spotlight finds it.
[[build.step]]
install = { app = ["Mimi.app"] }
when = { os = "darwin" }

# The daemon runs from inside its bundle, as the Nix module did. It reads
# ~/.config/mimi/config.toml by default, so no --config is passed.
[[service]]
name = "mimi"
command = "apps/Mimi.app/Contents/MacOS/mimi"
args = ["start"]
restart = "always"
