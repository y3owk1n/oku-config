# Agent skills from github.com/cursor/plugins, following its main branch.
# oku.lock records the commit, so every machine links the same files.
# `oku update skills-cursor` takes the newest commit.

[package]
name = "skills-cursor"
description = "Agent skills from the cursor/plugins repo"
homepage = "https://github.com/cursor/plugins"

[version]
from = "git-branch"
repo = "https://github.com/cursor/plugins"
branch = "main"

# The package only holds files. lists/ai.toml links the skills out of it.
[build]
needs = ["git"]
source = { git = "https://github.com/cursor/plugins", tag = "{{tag}}" }

[[build.step]]
run = """
set -eu
rm -rf .git
cp -R . {{prefix}}
"""
shell = "sh"
