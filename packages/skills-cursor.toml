# Agent skills from github.com/cursor/plugins, following its main branch.
# oku.lock records the commit, so every machine links the same files.
# `oku update skills-cursor` takes the newest commit.

[package]
name = "skills-cursor"
description = "Agent skills from the cursor/plugins repo"
homepage = "https://github.com/cursor/plugins"

[version]
from = "git-branch"
repo = "https://github.com/cursor/plugins"
branch = "main"

# What the build needs of the machine, which oku checks and does not install.
# The Command Line Tools give macOS its compiler, make and git. On Linux
# bootstrap/linux.sh installs these packages.
[host]
xcode-clt = { path = "/Library/Developer/CommandLineTools/usr/bin/clang", install = "xcode-select --install", when = { os = "darwin" } }
git = { command = "git", apt = "git", dnf = "git", pacman = "git", when = { os = "linux" } }

# The package only holds files. lists/ai.toml links the skills out of it.
[build]
needs = ["git"]
source = { git = "https://github.com/cursor/plugins", tag = "{{tag}}" }
when = [{ os = "darwin" }, { os = "linux" }]

[[build.step]]
run = """
set -eu
rm -rf .git
cp -R . {{prefix}}
"""
shell = "sh"
