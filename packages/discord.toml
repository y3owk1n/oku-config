[package]
name = "discord"
description = "Voice and text chat"
homepage = "https://discord.com"

# Discord updates itself in ~/Applications. oku replaces that copy on the next
# `oku update` of this package. For a newer version change `value`,
# and the sha256. `oku manifest bump --to <version>` does both, the url takes
# the version from `value`. The Homebrew cask `discord` lists the current one.
[version]
value = "0.0.412"

# The image holds one app for both Intel and Apple silicon.
[[artifact]]
match = { os = "darwin", arch = "arm64" }
url = "https://dl.discordapp.net/apps/osx/{{version}}/Discord.dmg"
sha256 = "5102d468e5593a5ffd5a3ecd38a10e9f63b349e7a3caa074eee8d6532f573a19"
app = ["Discord.app"]
