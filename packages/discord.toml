[package]
name = "discord"
description = "Voice and text chat"
homepage = "https://discord.com"

# Discord updates itself in ~/Applications. oku replaces that copy on the next
# `oku update` of this package. Each platform is at its own version, so each
# artifact reads its version from where its download link redirects to.
# Discord publishes no checksum for these files, so oku pins the first
# download of each version.

# The image holds one app for both Intel and Apple silicon.
[[artifact]]
match = { os = "darwin" }
version = { from = "redirect", repo = "https://discord.com/api/download?platform=osx", regex = '/osx/([0-9.]+)/' }
url = "https://stable.dl2.discordapp.net/apps/osx/{{version}}/Discord.dmg"
app = ["Discord.app"]

# Discord builds Linux for x86-64 only.
[[artifact]]
match = { os = "linux", arch = "amd64" }
version = { from = "redirect", repo = "https://discord.com/api/download?platform=linux&format=tar.gz", regex = '/linux/([0-9.]+)/' }
url = "https://stable.dl2.discordapp.net/apps/linux/{{version}}/discord-{{version}}.tar.gz"
strip = 1
bin = ["discord"]
app = [{ path = "discord", name = "Discord", icon = "discord.png" }]
