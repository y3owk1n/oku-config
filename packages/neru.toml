[package]
name = "neru"
description = "Keyboard driven navigation for the mouse"
homepage = "https://github.com/y3owk1n/neru"
license = "MIT"

# Built from main, before a release. `oku update neru` takes the newest commit.
[version]
from = "git-branch"
repo = "https://github.com/y3owk1n/neru"
branch = "main"

# On Linux the build links the X11 and Wayland libraries of the system through
# cgo. bootstrap/linux.sh installs their -dev packages, as neru's
# docs/LINUX_SETUP.md lists them. libei needs Debian 13 or Ubuntu 24.04.
#
# Windows builds with cgo off, as upstream does, so it needs no C compiler.
# `needs` holds for every OS, so cc is not in it. On macOS and Linux the cgo
# steps find /usr/bin/cc, which the build PATH always has.
[build]
needs = ["git"]
deps = [{ ref = "./go.toml", version = "~1.26" }]
source = { git = "https://github.com/y3owk1n/neru", tag = "{{tag}}" }

[[build.step]]
vendor = "go"

[[build.step]]
run = """
set -eu
go build -mod=vendor -trimpath -ldflags="-s -w -X github.com/y3owk1n/neru/internal/buildinfo.Version={{version}}" -o neru ./cmd/neru
mkdir -p man
go run -mod=vendor ./cmd/genman man
"""
shell = "sh"
# Fedora's libspa-0.2.pc, which pipewire pulls in, carries -fno-strict-overflow,
# and cgo rejects a flag it does not know unless it is allowed.
env = { CGO_ENABLED = "1", GOFLAGS = "-buildvcs=false", CGO_CFLAGS_ALLOW = "-fno-strict-overflow" }
when = [{ os = "darwin" }, { os = "linux" }]

# The .syso files carry the icon and the manifest that makes neru per-monitor
# DPI aware, which its screen code relies on. go-winres is vendored through
# cmd/neru/tools.go, as upstream's `just build-windows` runs it. PowerShell 5.1
# does not stop on a failed native command, so each one checks its exit code.
[[build.step]]
run = """
$ErrorActionPreference = 'Stop'
function Check { if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
Push-Location cmd/neru
go run -mod=vendor github.com/tc-hib/go-winres simply --icon ../../assets/neru-appicon.png --manifest gui --arch {{arch}} --file-description "Neru keyboard-driven navigation tool" --product-name Neru --original-filename neru.exe; Check
Pop-Location
go build -mod=vendor -trimpath "-ldflags=-s -w -X github.com/y3owk1n/neru/internal/buildinfo.Version={{version}}" -o neru.exe ./cmd/neru; Check
New-Item -ItemType Directory -Force man | Out-Null
go run -mod=vendor ./cmd/genman man; Check
"""
shell = "pwsh"
env = { CGO_ENABLED = "0", GOFLAGS = "-buildvcs=false" }
when = { os = "windows" }

[[build.step]]
run = """
set -eu
v={{version}}
app=Neru.app
mkdir -p $app/Contents/MacOS $app/Contents/Resources
cp neru $app/Contents/MacOS/neru
cp resources/icon.icns $app/Contents/Resources/
cp resources/Neru.entitlements $app/Contents/Resources/
sed -e "s/BUNDLE_VERSION/${v%%-*}/g" -e "s/SHORT_VERSION/${v%%-*}/g" -e 's/BUILD_ID/{{version}}/g' resources/Info.plist.template > $app/Contents/Info.plist
codesign --force --deep --sign - --entitlements resources/Neru.entitlements --options runtime $app
"""
shell = "sh"
when = { os = "darwin" }

[[build.step]]
install = { man = ["man/neru.1"], completions = { generate = "./neru completion {{shell}}", name = "neru" } }
when = [{ os = "darwin" }, { os = "linux" }]

# oku runs generate through cmd on Windows, which reads ./neru as a switch.
# cmd looks in the working directory first, so the bare name finds neru.exe.
[[build.step]]
install = { man = ["man/neru.1"], completions = { generate = "neru.exe completion {{shell}}", name = "neru" } }
when = { os = "windows" }

[[build.step]]
install = { bin = ["neru"] }
when = { os = "linux" }

[[build.step]]
install = { bin = ["neru.exe"] }
when = { os = "windows" }

# The bundle goes to ~/Applications too, so macOS lists it under Accessibility
# by name and Spotlight finds it. The command is the bundle's program, which
# runs the copy in ~/Applications, so it shares the app's permissions.
[[build.step]]
install = { bin = ["Neru.app/Contents/MacOS/neru"], app = ["Neru.app"] }
when = { os = "darwin" }

# The daemon runs from inside its bundle, as the Nix module did. It reads
# ~/.config/neru/config.toml by default, so no --config is passed.
#
# On Linux the daemon needs the display of the session, and
# `neru services install` writes a unit that waits for graphical-session.target,
# which the unit of oku does not. So oku runs no service there.
[[service]]
name = "neru"
command = "bin/neru"
args = ["launch"]
restart = "always"
when = { os = "darwin" }

# On Windows oku's service is a scheduled task that starts at logon, which is
# what `neru services install` registers too. Use one of them, not both.
[[service]]
name = "neru"
command = "bin/neru.exe"
args = ["launch"]
restart = "always"
when = { os = "windows" }
