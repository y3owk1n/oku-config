[package]
name = "neru"
description = "Keyboard driven navigation for the mouse"
homepage = "https://github.com/y3owk1n/neru"
license = "MIT"

[version]
from = "github-releases"
repo = "y3owk1n/neru"
strip_prefix = "v"

[build]
needs = ["git", "cc"]
deps = ["./go.toml"]
source = { git = "https://github.com/y3owk1n/neru", tag = "{{tag}}" }

[[build.step]]
vendor = "go"

[[build.step]]
run = """
set -eu
go build -mod=vendor -trimpath -ldflags="-s -w -X github.com/y3owk1n/neru/internal/buildinfo.Version={{tag}}" -o neru ./cmd/neru
mkdir -p man
go run -mod=vendor ./cmd/genman man
"""
shell = "sh"
env = { CGO_ENABLED = "1", GOFLAGS = "-buildvcs=false" }

[[build.step]]
run = """
set -eu
app={{prefix}}/Neru.app
mkdir -p $app/Contents/MacOS $app/Contents/Resources
cp neru $app/Contents/MacOS/neru
cp resources/icon.icns $app/Contents/Resources/
cp resources/Neru.entitlements $app/Contents/Resources/
sed -e 's/BUNDLE_VERSION/{{version}}/g' -e 's/SHORT_VERSION/{{version}}/g' -e 's/BUILD_ID/{{tag}}/g' resources/Info.plist.template > $app/Contents/Info.plist
codesign --force --deep --sign - --entitlements resources/Neru.entitlements --options runtime $app
"""
shell = "sh"

[[build.step]]
install = { bin = ["neru"], man = ["man/neru.1"] }

# The daemon runs from inside its bundle, as the Nix module did. It reads
# ~/.config/neru/config.toml by default, so no --config is passed.
[[service]]
name = "neru"
command = "Neru.app/Contents/MacOS/neru"
args = ["launch"]
restart = "always"
