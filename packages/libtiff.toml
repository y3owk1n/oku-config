[package]
name = "libtiff"
description = "Library and tools for TIFF images"
homepage = "https://libtiff.gitlab.io/libtiff/"
license = "libtiff"

# The version follows the project's GitLab releases, which leave out the
# release candidates it tags as v4.7.2rc2. GitLab reports no checksum, so
# oku.lock pins each version's archive when oku first downloads it.
[version]
from = "gitlab-releases"
repo = "libtiff/libtiff"
strip_prefix = "v"

[build]
needs = ["cc", "make"]
source = { url = "https://download.osgeo.org/libtiff/tiff-{{version}}.tar.gz", strip = 1 }
deps = ["./cmake.toml", "./jpeg-turbo.toml"]

[runtime]
deps = ["./jpeg-turbo.toml"]

# zlib comes from the system. JPEG is the one codec from another package, and
# the rest stay off so the library has one runtime dep.
# The two RPATH flags are for Linux. cmake passes its own -rpath, so the linker
# ignores the LD_RUN_PATH that oku sets, and cmake drops the paths on install.
# With the flags a library finds the others of this package and its deps.
[[build.step]]
run = """
cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX={{prefix}} \
  -DCMAKE_INSTALL_RPATH="{{prefix}}/lib${LD_RUN_PATH:+:$LD_RUN_PATH}" -DCMAKE_BUILD_RPATH="$LD_RUN_PATH" \
  -DCMAKE_INSTALL_LIBDIR={{prefix}}/lib -DCMAKE_INSTALL_NAME_DIR={{prefix}}/lib \
  -DBUILD_SHARED_LIBS=ON -Djpeg=ON -Dzlib=ON -Dlzma=OFF -Dzstd=OFF -Dwebp=OFF -Dlerc=OFF \
  -Djbig=OFF -Dlibdeflate=OFF -Dtiff-opengl=OFF -Dtiff-docs=OFF -Dtiff-tests=OFF -Dtiff-contrib=OFF
cmake --build build -j{{jobs}}
cmake --install build
"""
shell = "sh"
