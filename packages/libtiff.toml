[package]
name = "libtiff"
description = "Library and tools for TIFF images"
homepage = "https://libtiff.gitlab.io/libtiff/"
license = "libtiff"

# The version and the sha256 are fixed. The project tags its release
# candidates as v4.7.2rc2, with no dash, and oku would take one for a release.
# To take a newer release, change both.
[version]
value = "4.7.2"

[build]
needs = ["cc", "make"]
source = { url = "https://download.osgeo.org/libtiff/tiff-{{version}}.tar.gz", sha256 = "672bd7d10aee4606171afb864f3570b83340f6a33e2c186dc0512f7145ffdf6a", strip = 1 }
deps = ["./cmake.toml", "./jpeg-turbo.toml"]

[runtime]
deps = ["./jpeg-turbo.toml"]

# zlib comes from the system. JPEG is the one codec from another package, and
# the rest stay off so the library has one runtime dep.
[[build.step]]
run = """
cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX={{prefix}} \
  -DCMAKE_INSTALL_LIBDIR={{prefix}}/lib -DCMAKE_INSTALL_NAME_DIR={{prefix}}/lib \
  -DBUILD_SHARED_LIBS=ON -Djpeg=ON -Dzlib=ON -Dlzma=OFF -Dzstd=OFF -Dwebp=OFF -Dlerc=OFF \
  -Djbig=OFF -Dlibdeflate=OFF -Dtiff-opengl=OFF -Dtiff-docs=OFF -Dtiff-tests=OFF -Dtiff-contrib=OFF
cmake --build build -j{{jobs}}
cmake --install build
"""
shell = "sh"
