[package]
name = "freebuff"
description = "Free coding agent for the terminal"
homepage = "https://freebuff.com"
license = "MIT"

# The release repo also holds the codebuff releases, which push every freebuff
# tag out of the newest 100 that oku reads. The npm package has the same
# versions, so they come from there. Upstream publishes no checksum file.
[version]
from = "npm"
repo = "freebuff"

[[artifact]]
match = { os = "darwin", arch = "arm64" }
url = "https://github.com/CodebuffAI/codebuff-community/releases/download/freebuff-v{{version}}/freebuff-darwin-arm64.tar.gz"
bin = ["freebuff"]

[[artifact]]
match = { os = "linux", arch = "arm64" }
url = "https://github.com/CodebuffAI/codebuff-community/releases/download/freebuff-v{{version}}/freebuff-linux-arm64.tar.gz"
bin = ["freebuff"]

[[artifact]]
match = { os = "linux", arch = "amd64" }
url = "https://github.com/CodebuffAI/codebuff-community/releases/download/freebuff-v{{version}}/freebuff-linux-x64.tar.gz"
bin = ["freebuff"]
