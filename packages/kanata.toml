[package]
name = "kanata"
description = "Software keyboard remapper"
homepage = "https://github.com/jtroo/kanata"
license = "LGPL-3.0-only"

[version]
from = "github-releases"
repo = "jtroo/kanata"
strip_prefix = "v"

# kanata needs root and the Karabiner VirtualHIDDevice driver on macOS, and
# access to /dev/uinput on Linux. oku installs the program only, the owner
# starts it by hand as before. Upstream builds Linux for x86-64 only.
# kanata v1.13.0 and later need Karabiner driver v8.0.0, older ones need 6.x.
# Move packages/karabiner-driver.toml together with kanata.
[[artifact]]
match = { os = "darwin", arch = "arm64" }
url = "https://github.com/jtroo/kanata/releases/download/{{tag}}/macos-binaries-arm64.zip"
sha256_url = "https://github.com/jtroo/kanata/releases/download/{{tag}}/sha256sums"
bin = [{ name = "kanata", run = "{{pkg}}/kanata_macos_arm64" }]

[[artifact]]
match = { os = "linux", arch = "amd64" }
url = "https://github.com/jtroo/kanata/releases/download/{{tag}}/linux-binaries-x64.zip"
sha256_url = "https://github.com/jtroo/kanata/releases/download/{{tag}}/sha256sums"
bin = [{ name = "kanata", run = "{{pkg}}/kanata_linux_x64" }]
