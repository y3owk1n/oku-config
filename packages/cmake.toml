[package]
name = "cmake"
description = "Cross-platform build system generator"
homepage = "https://cmake.org"
license = "BSD-3-Clause"

[version]
from = "github-releases"
repo = "Kitware/CMake"
strip_prefix = "v"

# Kitware's own universal build. The archive holds CMake.app, and strip = 3
# leaves its Contents directory, so bin/cmake finds share/cmake-* next to it.
[[artifact]]
match = { os = "darwin" }
url = "https://github.com/Kitware/CMake/releases/download/{{tag}}/cmake-{{version}}-macos-universal.tar.gz"
sha256_url = "https://github.com/Kitware/CMake/releases/download/{{tag}}/cmake-{{version}}-SHA-256.txt"
strip = 3
bin = ["bin/cmake", "bin/ctest", "bin/cpack", "bin/ccmake"]

[[artifact]]
match = { os = "linux", arch = "arm64" }
url = "https://github.com/Kitware/CMake/releases/download/{{tag}}/cmake-{{version}}-linux-aarch64.tar.gz"
sha256_url = "https://github.com/Kitware/CMake/releases/download/{{tag}}/cmake-{{version}}-SHA-256.txt"
strip = 1
bin = ["bin/cmake", "bin/ctest", "bin/cpack", "bin/ccmake"]

[[artifact]]
match = { os = "linux", arch = "amd64" }
url = "https://github.com/Kitware/CMake/releases/download/{{tag}}/cmake-{{version}}-linux-x86_64.tar.gz"
sha256_url = "https://github.com/Kitware/CMake/releases/download/{{tag}}/cmake-{{version}}-SHA-256.txt"
strip = 1
bin = ["bin/cmake", "bin/ctest", "bin/cpack", "bin/ccmake"]
