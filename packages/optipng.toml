[package]
name = "optipng"
description = "PNG optimiser that recompresses images without loss"
homepage = "https://optipng.sourceforge.net"
license = "Zlib"

# The project is on SourceForge, whose link to the newest file redirects to
# a path that holds the version. It publishes no checksum, so oku pins the
# first download of each version.
[version]
from = "redirect"
repo = "https://sourceforge.net/projects/optipng/files/latest/download"
regex = '/optipng-([0-9.]+)/'

# What the build needs of the machine, which oku checks and does not install.
# The Command Line Tools give macOS its compiler, make and git. On Linux
# bootstrap/linux.sh installs these packages.
[host]
xcode-clt = { path = "/Library/Developer/CommandLineTools/usr/bin/clang", install = "xcode-select --install", when = { os = "darwin" } }
cc = { command = "cc", apt = "build-essential", dnf = "gcc-c++", pacman = "base-devel", when = { os = "linux" } }
make = { command = "make", apt = "build-essential", dnf = "make", pacman = "base-devel", when = { os = "linux" } }

# The build uses the libpng and zlib copies in the archive, so the program
# needs no other package.
[build]
needs = ["cc", "make"]
source = { url = "https://downloads.sourceforge.net/project/optipng/OptiPNG/optipng-{{version}}/optipng-{{version}}.tar.gz", strip = 1 }
when = [{ os = "darwin" }, { os = "linux" }]

# oku links man pages from share/man only.
[[build.step]]
run = "./configure --prefix={{prefix}} --mandir={{prefix}}/share/man && make -j{{jobs}} && make install"
shell = "sh"
