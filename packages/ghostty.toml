[package]
name = "ghostty"
description = "Fast, native terminal emulator"
homepage = "https://ghostty.org"
license = "MIT"

# Each artifact follows its own source. The app follows Ghostty's update feed,
# which names a release once its download exists. Ghostty publishes no
# checksum for it, so oku pins the first download. Set `auto-update = off` in the Ghostty
# config, so that the app does not replace itself behind oku.
[[artifact]]
match = { os = "darwin" }
version = { from = "sparkle", repo = "https://release.files.ghostty.org/appcast.xml" }
url = "https://release.files.ghostty.org/{{version}}/Ghostty.dmg"
app = ["Ghostty.app"]
bin = ["Ghostty.app/Contents/MacOS/ghostty"]
man = ["Ghostty.app/Contents/Resources/man/man1/ghostty.1"]

# The AppImage mounts itself through FUSE to run, which oku checks and does not
# install. bootstrap/linux.sh installs it.
[host]
fuse = { apt = "libfuse2t64", dnf = "fuse-libs", pacman = "fuse2", when = { os = "linux" } }

# Upstream ships no Linux binary. The AppImage comes from pkgforge-dev, which
# the install page of ghostty.org links, and follows that repo's releases,
# whose files GitHub reports a sha256 for. An AppImage needs FUSE, which
# bootstrap/linux.sh installs.
#
# The arm64 machine is a Fedora VM whose virgl GPU stops at OpenGL 4.1, and
# ghostty needs 4.3. The mesa in the AppImage has only softpipe, at 3.3, so the
# launcher points EGL at the host's mesa, whose llvmpipe has 4.6. The same fix
# as nixGL with LIBGL_ALWAYS_SOFTWARE in the nix config.
[[artifact]]
match = { os = "linux", arch = "arm64" }
version = { from = "github-releases", repo = "pkgforge-dev/ghostty-appimage", strip_prefix = "v" }
url = "https://github.com/pkgforge-dev/ghostty-appimage/releases/download/{{tag}}/Ghostty-{{version}}-aarch64.AppImage"
bin = [{ name = "ghostty", run = "/bin/sh", args = ["-c", "LIBGL_ALWAYS_SOFTWARE=true __EGL_VENDOR_LIBRARY_FILENAMES=${XDG_CONFIG_HOME:-$HOME/.config}/ghostty/egl-mesa.json exec \"$0\" \"$@\"", "{{pkg}}/Ghostty-{{version}}-aarch64.AppImage"] }]

[[artifact]]
match = { os = "linux", arch = "amd64" }
version = { from = "github-releases", repo = "pkgforge-dev/ghostty-appimage", strip_prefix = "v" }
url = "https://github.com/pkgforge-dev/ghostty-appimage/releases/download/{{tag}}/Ghostty-{{version}}-x86_64.AppImage"
bin = ["ghostty"]
