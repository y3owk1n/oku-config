[package]
name = "gifsicle"
description = "Makes, edits and optimises GIF images and animations"
homepage = "https://www.lcdf.org/gifsicle/"
license = "GPL-2.0-only"

# Upstream publishes its release archive on lcdf.org only, and the GitHub tags
# hold no configure script. The tags name the versions, and the archive comes
# from lcdf.org.
[version]
from = "git-tags"
repo = "https://github.com/kohler/gifsicle"
strip_prefix = "v"

# What the build needs of the machine, which oku checks and does not install.
# The Command Line Tools give macOS its compiler, make and git. On Linux
# bootstrap/linux.sh installs these packages.
[host]
xcode-clt = { path = "/Library/Developer/CommandLineTools/usr/bin/clang", install = "xcode-select --install", when = { os = "darwin" } }
cc = { command = "cc", apt = "build-essential", dnf = "gcc-c++", pacman = "base-devel", when = { os = "linux" } }
make = { command = "make", apt = "build-essential", dnf = "make", pacman = "base-devel", when = { os = "linux" } }

[build]
needs = ["cc", "make"]
source = { url = "https://www.lcdf.org/gifsicle/gifsicle-{{version}}.tar.gz", strip = 1 }
when = [{ os = "darwin" }, { os = "linux" }]

# gifview needs X11, which macOS does not have.
[[build.step]]
run = "./configure --prefix={{prefix}} --disable-gifview && make -j{{jobs}} && make install"
shell = "sh"
