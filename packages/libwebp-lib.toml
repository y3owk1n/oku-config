[package]
name = "libwebp-lib"
description = "WebP codec libraries and headers, built from source"
homepage = "https://developers.google.com/speed/webp"
license = "BSD-3-Clause"

# libwebp.toml installs upstream's prebuilt tools. That archive holds static
# libraries and no .pc file, and ImageMagick finds WebP through pkg-config
# alone. This package builds the libraries with their .pc files. The version
# follows the git tags, as libwebp.toml does, so both stay on one release.
# Google publishes no checksum, so oku.lock pins each version's archive when
# oku first downloads it.
[version]
from = "git-tags"
repo = "https://github.com/webmproject/libwebp"
strip_prefix = "v"

[build]
needs = ["cc", "make"]
source = { url = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-{{version}}.tar.gz", strip = 1 }
deps = ["./cmake.toml"]

# The two RPATH flags are for Linux. cmake passes its own -rpath, so the linker
# ignores the LD_RUN_PATH that oku sets, and cmake drops the paths on install.
# With the flags a library finds the others of this package and its deps.
[[build.step]]
run = """
cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX={{prefix}} \
  -DCMAKE_INSTALL_RPATH="{{prefix}}/lib${LD_RUN_PATH:+:$LD_RUN_PATH}" -DCMAKE_BUILD_RPATH="$LD_RUN_PATH" \
  -DCMAKE_INSTALL_LIBDIR={{prefix}}/lib -DCMAKE_INSTALL_NAME_DIR={{prefix}}/lib \
  -DBUILD_SHARED_LIBS=ON -DWEBP_BUILD_ANIM_UTILS=OFF -DWEBP_BUILD_CWEBP=OFF -DWEBP_BUILD_DWEBP=OFF \
  -DWEBP_BUILD_GIF2WEBP=OFF -DWEBP_BUILD_IMG2WEBP=OFF -DWEBP_BUILD_VWEBP=OFF -DWEBP_BUILD_WEBPINFO=OFF \
  -DWEBP_BUILD_WEBPMUX=OFF -DWEBP_BUILD_EXTRAS=OFF
cmake --build build -j{{jobs}}
cmake --install build
"""
shell = "sh"
