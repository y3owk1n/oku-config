[package]
name = "libwebp-lib"
description = "WebP codec libraries and headers, built from source"
homepage = "https://developers.google.com/speed/webp"
license = "BSD-3-Clause"

# libwebp.toml installs upstream's prebuilt tools. That archive holds static
# libraries and no .pc file, and ImageMagick finds WebP through pkg-config
# alone. This package builds the libraries with their .pc files. The version
# and the sha256 are fixed. To take a newer release, change both.
[version]
value = "1.6.0"

[build]
needs = ["cc", "make"]
source = { url = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-{{version}}.tar.gz", sha256 = "e4ab7009bf0629fd11982d4c2aa83964cf244cffba7347ecd39019a9e38c4564", strip = 1 }
deps = ["./cmake.toml"]

[[build.step]]
run = """
cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX={{prefix}} \
  -DCMAKE_INSTALL_LIBDIR={{prefix}}/lib -DCMAKE_INSTALL_NAME_DIR={{prefix}}/lib \
  -DBUILD_SHARED_LIBS=ON -DWEBP_BUILD_ANIM_UTILS=OFF -DWEBP_BUILD_CWEBP=OFF -DWEBP_BUILD_DWEBP=OFF \
  -DWEBP_BUILD_GIF2WEBP=OFF -DWEBP_BUILD_IMG2WEBP=OFF -DWEBP_BUILD_VWEBP=OFF -DWEBP_BUILD_WEBPINFO=OFF \
  -DWEBP_BUILD_WEBPMUX=OFF -DWEBP_BUILD_EXTRAS=OFF
cmake --build build -j{{jobs}}
cmake --install build
"""
shell = "sh"
