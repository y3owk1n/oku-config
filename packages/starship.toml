[package]
name = "starship"
description = "Cross-shell prompt"
homepage = "https://github.com/starship/starship"
license = "ISC"

[version]
from = "github-releases"
repo = "starship/starship"
strip_prefix = "v"

# Completions come from the program itself, the release holds none.
[[artifact]]
match = { os = "linux", arch = "amd64", libc = "glibc" }
url = "https://github.com/starship/starship/releases/download/{{tag}}/starship-x86_64-unknown-linux-gnu.tar.gz"
sha256_url = "https://github.com/starship/starship/releases/download/{{tag}}/starship-x86_64-unknown-linux-gnu.tar.gz.sha256"
bin = ["starship"]
completions = { generate = "starship completions {{shell}}" }

[[artifact]]
match = { os = "linux", arch = "amd64" }
url = "https://github.com/starship/starship/releases/download/{{tag}}/starship-x86_64-unknown-linux-musl.tar.gz"
sha256_url = "https://github.com/starship/starship/releases/download/{{tag}}/starship-x86_64-unknown-linux-musl.tar.gz.sha256"
bin = ["starship"]
completions = { generate = "starship completions {{shell}}" }

[[artifact]]
match = { os = "linux", arch = "arm64" }
url = "https://github.com/starship/starship/releases/download/{{tag}}/starship-aarch64-unknown-linux-musl.tar.gz"
sha256_url = "https://github.com/starship/starship/releases/download/{{tag}}/starship-aarch64-unknown-linux-musl.tar.gz.sha256"
bin = ["starship"]
completions = { generate = "starship completions {{shell}}" }

[[artifact]]
match = { os = "darwin", arch = "arm64" }
url = "https://github.com/starship/starship/releases/download/{{tag}}/starship-aarch64-apple-darwin.tar.gz"
sha256_url = "https://github.com/starship/starship/releases/download/{{tag}}/starship-aarch64-apple-darwin.tar.gz.sha256"
bin = ["starship"]
completions = { generate = "starship completions {{shell}}" }
