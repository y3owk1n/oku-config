[package]
name = "virtualbuddy"
description = "Virtualize macOS 12 and later on Apple Silicon"
homepage = "https://github.com/insidegui/VirtualBuddy"
license = "BSD-2-Clause"

# Versions come from the app's own update feed. With join = "+" the version is
# the release and its build, such as 2.1+325, and the file name holds both.
# The update server publishes no checksum, so oku pins the first download of
# each version.
[version]
from = "sparkle"
repo = "https://su.virtualbuddy.app/appcast.xml?channel=release"
join = "+"

[[artifact]]
match = { os = "darwin", arch = "arm64" }
url = "https://su.virtualbuddy.app/VirtualBuddy_v{{version_part1}}-{{version_part2}}.dmg"
app = ["VirtualBuddy.app"]
