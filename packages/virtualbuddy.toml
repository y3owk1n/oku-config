[package]
name = "virtualbuddy"
description = "Virtualize macOS 12 and later on Apple Silicon"
homepage = "https://github.com/insidegui/VirtualBuddy"
license = "BSD-2-Clause"

# The file name holds a build number that no template variable gives, so the
# version is fixed. For a newer release change `value`, the url and the sha256.
[version]
value = "2.1"

[[artifact]]
match = { os = "darwin", arch = "arm64" }
url = "https://github.com/insidegui/VirtualBuddy/releases/download/2.1/VirtualBuddy_v2.1-325.dmg"
sha256 = "6ed17e8d7245931fd405c419321ace7ef9333fe2e3d59b3a7f78e34fcbe628b6"
app = ["VirtualBuddy.app"]
