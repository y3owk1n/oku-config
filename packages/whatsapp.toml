[package]
name = "whatsapp"
description = "Native desktop client for WhatsApp"
homepage = "https://www.whatsapp.com"

# WhatsApp updates itself in ~/Applications. oku replaces that copy on the next
# `oku update` of this package. Versions come from the app's own update feed,
# and the url takes the version behind a leading `2.`. WhatsApp publishes no
# checksum, so oku pins the first download of each version.
[version]
from = "sparkle"
repo = "https://web.whatsapp.com/desktop/mac_native/updates/?branch=master&configuration=Release"

[[artifact]]
match = { os = "darwin", arch = "arm64" }
url = "https://web.whatsapp.com/desktop/mac_native/release/?version=2.{{version}}&extension=zip&configuration=Release&branch=master&is_buck=true"
app = ["WhatsApp.app"]
