[package]
name = "lua"
description = "Lua 5.1, the version Neovim plugins are written for"
homepage = "https://www.lua.org"
license = "MIT"

# Held at the last 5.1 release on purpose. lua.org publishes no later 5.1.
[version]
value = "5.1.5"

[build]
needs = ["cc", "make"]
source = { url = "https://www.lua.org/ftp/lua-{{version}}.tar.gz", sha256 = "2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333", strip = 1 }

# oku links man pages from share/man only, and lua installs to man by default.
# luaconf.h searches /usr/local for modules unless LUA_ROOT names the package.
[[build.step]]
run = """
sed -i.bak 's|#define LUA_ROOT.*|#define LUA_ROOT "{{prefix}}/"|' src/luaconf.h
make macosx -j{{jobs}}
make install INSTALL_TOP={{prefix}} INSTALL_MAN={{prefix}}/share/man/man1
"""
shell = "sh"
when = { os = "darwin" }

# Not tested. Needs the readline headers on the machine.
[[build.step]]
run = """
sed -i.bak 's|#define LUA_ROOT.*|#define LUA_ROOT "{{prefix}}/"|' src/luaconf.h
make linux -j{{jobs}}
make install INSTALL_TOP={{prefix}} INSTALL_MAN={{prefix}}/share/man/man1
"""
shell = "sh"
when = { os = "linux" }
