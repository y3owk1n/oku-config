[package]
name = "coreutils"
description = "GNU file, shell and text utilities, each with a g prefix"
homepage = "https://www.gnu.org/software/coreutils/"
license = "GPL-3.0-or-later"

# GNU publishes archives on its own servers only. The tags of the GitHub mirror
# name the versions, and the archive comes from ftp.gnu.org.
[version]
from = "git-tags"
repo = "https://github.com/coreutils/coreutils"
strip_prefix = "v"

# What the build needs of the machine, which oku checks and does not install.
# The Command Line Tools give macOS its compiler, make and git. On Linux
# bootstrap/linux.sh installs these packages.
[host]
xcode-clt = { path = "/Library/Developer/CommandLineTools/usr/bin/clang", install = "xcode-select --install", when = { os = "darwin" } }
cc = { command = "cc", apt = "build-essential", dnf = "gcc-c++", pacman = "base-devel", when = { os = "linux" } }
make = { command = "make", apt = "build-essential", dnf = "make", pacman = "base-devel", when = { os = "linux" } }

[build]
needs = ["cc", "make"]
source = { url = "https://ftp.gnu.org/gnu/coreutils/coreutils-{{version}}.tar.xz", strip = 1 }
when = [{ os = "darwin" }, { os = "linux" }]

# Every program gets a g prefix, such as gls and gdate, so none of them takes
# the place of a macOS tool. This release has no --without-gmp flag any more.
[[build.step]]
run = """
./configure --prefix={{prefix}} --program-prefix=g --without-selinux --disable-nls
make -j{{jobs}}
make install
"""
shell = "sh"
