[package]
name = "jpeg-turbo"
description = "JPEG codec library with cjpeg, djpeg and jpegtran"
homepage = "https://libjpeg-turbo.org"
license = "IJG AND Zlib AND BSD-3-Clause"

# The source is a git tag, which needs no sha256, so oku follows new releases.
[version]
from = "github-releases"
repo = "libjpeg-turbo/libjpeg-turbo"

# What the build needs of the machine, which oku checks and does not install.
# The Command Line Tools give macOS its compiler, make and git. On Linux
# bootstrap/linux.sh installs these packages.
[host]
xcode-clt = { path = "/Library/Developer/CommandLineTools/usr/bin/clang", install = "xcode-select --install", when = { os = "darwin" } }
cc = { command = "cc", apt = "build-essential", dnf = "gcc-c++", pacman = "base-devel", when = { os = "linux" } }
make = { command = "make", apt = "build-essential", dnf = "make", pacman = "base-devel", when = { os = "linux" } }
git = { command = "git", apt = "git", dnf = "git", pacman = "git", when = { os = "linux" } }

# arm64 needs no assembler. On x86 the SIMD code wants nasm, and without it
# the build turns SIMD off.
[build]
needs = ["cc", "make", "git"]
source = { git = "https://github.com/libjpeg-turbo/libjpeg-turbo", tag = "{{tag}}" }
deps = ["./cmake.toml"]
when = [{ os = "darwin" }, { os = "linux" }]

# The shared library holds a static helper, which needs position independent
# code. The gcc of Debian makes that by default, the gcc of Fedora does not.
# The two RPATH flags are for Linux. cmake passes its own -rpath, so the linker
# ignores the LD_RUN_PATH that oku sets, and cmake drops the paths on install.
# With the flags a library finds the others of this package and its deps.
[[build.step]]
run = """
cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX={{prefix}} \
  -DCMAKE_INSTALL_RPATH="{{prefix}}/lib${LD_RUN_PATH:+:$LD_RUN_PATH}" -DCMAKE_BUILD_RPATH="$LD_RUN_PATH" \
  -DCMAKE_INSTALL_LIBDIR={{prefix}}/lib -DCMAKE_INSTALL_NAME_DIR={{prefix}}/lib \
  -DWITH_JPEG8=1 -DENABLE_STATIC=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
cmake --build build -j{{jobs}}
cmake --install build
"""
shell = "sh"
