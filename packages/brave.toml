[package]
name = "brave"
description = "Web browser focusing on privacy"
homepage = "https://brave.com"
license = "MPL-2.0"

# Brave Browser updates itself in ~/Applications. oku replaces that copy on the next
# `oku update` of this package. For a newer version change `value`,
# the build in the url and the sha256. The build is the version without its
# first dot and its last part, so 1.95.104.0 is 195.104. The Homebrew cask
# `brave-browser` lists the current one.
[version]
value = "1.95.104.0"

[[artifact]]
match = { os = "darwin", arch = "arm64" }
url = "https://updates-cdn.bravesoftware.com/sparkle/Brave-Browser/stable-arm64/195.104/Brave-Browser-arm64.dmg"
sha256 = "f6823d53b3e9a287b8f8830b728ba9b34fe2d4a9f6ee4e05b3bcd4a21ee25eaf"
app = ["Brave Browser.app"]
