[package]
name = "pngquant"
description = "Lossy PNG compressor"
homepage = "https://pngquant.org"
license = "GPL-3.0-or-later"

# The git repo keeps libimagequant in a submodule, which a tag archive leaves
# out. The crate from crates.io is complete and has its Cargo.lock, so the
# version follows crates.io, and oku checks each .crate against the sha256
# that crates.io publishes for it.
[version]
from = "crates"
repo = "pngquant"

# The static feature makes libpng-sys and lcms2-sys compile their bundled C
# with cc alone, so the build needs no cmake and no pkg-config. The libpng that
# the locked libpng-sys 1.1.9 bundles includes <fp.h> when
# TARGET_OS_MAC is defined. Apple clang now defines it by itself and the macOS
# SDK has no fp.h, so the macOS build turns those built-in macros off.
[build]
needs = ["cc"]
deps = ["./rust.toml"]
source = { url = "https://static.crates.io/crates/pngquant/pngquant-{{version}}.crate", strip = 1 }

[[build.step]]
vendor = "cargo"

[[build.step]]
run = "cargo build --release --offline --locked --features static -j{{jobs}}"
shell = "sh"
when = { os = "darwin" }
env = { CFLAGS = "-fno-define-target-os-macros" }

[[build.step]]
when = { os = "linux" }
run = "cargo build --release --offline --locked --features static -j{{jobs}}"
shell = "sh"

[[build.step]]
install = { bin = ["target/release/pngquant"] }
