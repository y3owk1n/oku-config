[package]
name = "firefox"
description = "Web browser"
homepage = "https://www.mozilla.org/firefox/"
license = "MPL-2.0"

# Firefox updates itself in ~/Applications. oku replaces that copy on the next
# `oku update` of this package. Versions come from Mozilla's product details.
# Mozilla's SHA256SUMS names both Linux files firefox-<version>.tar.xz, so
# sha256_url cannot tell them apart, and oku pins the first download of each
# version.
[version]
from = "page"
repo = "https://product-details.mozilla.org/1.0/firefox_versions.json"
regex = '"LATEST_FIREFOX_VERSION"\s*:\s*"([0-9][0-9A-Za-z._+-]*)"'

# The image holds one app for both Intel and Apple silicon, in US English.
[[artifact]]
match = { os = "darwin", arch = "arm64" }
url = "https://download-installer.cdn.mozilla.net/pub/firefox/releases/{{version}}/mac/en-US/Firefox%20{{version}}.dmg"
app = ["Firefox.app"]

[[artifact]]
match = { os = "linux", arch = "arm64" }
url = "https://download-installer.cdn.mozilla.net/pub/firefox/releases/{{version}}/linux-aarch64/en-US/firefox-{{version}}.tar.xz"
strip = 1
bin = ["firefox"]
app = [{ path = "firefox", name = "Firefox", icon = "browser/chrome/icons/default/default128.png" }]

[[artifact]]
match = { os = "linux", arch = "amd64" }
url = "https://download-installer.cdn.mozilla.net/pub/firefox/releases/{{version}}/linux-x86_64/en-US/firefox-{{version}}.tar.xz"
strip = 1
bin = ["firefox"]
app = [{ path = "firefox", name = "Firefox", icon = "browser/chrome/icons/default/default128.png" }]
