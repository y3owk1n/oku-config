[package]
name = "ffmpeg"
description = "Static ffmpeg from the ffmpeg-static project"
homepage = "https://github.com/eugeneware/ffmpeg-static"
license = "GPL-3.0-or-later"

# FFmpeg itself publishes source only. These are the static builds that the
# ffmpeg-static npm package downloads. They trail upstream, and the project
# publishes no checksum file.
[version]
from = "github-releases"
repo = "eugeneware/ffmpeg-static"
strip_prefix = "b"

[[artifact]]
match = { os = "darwin", arch = "arm64" }
url = "https://github.com/eugeneware/ffmpeg-static/releases/download/{{tag}}/ffmpeg-darwin-arm64.gz"
bin = ["ffmpeg"]

[[artifact]]
match = { os = "linux", arch = "arm64" }
url = "https://github.com/eugeneware/ffmpeg-static/releases/download/{{tag}}/ffmpeg-linux-arm64.gz"
bin = ["ffmpeg"]

[[artifact]]
match = { os = "linux", arch = "amd64" }
url = "https://github.com/eugeneware/ffmpeg-static/releases/download/{{tag}}/ffmpeg-linux-x64.gz"
bin = ["ffmpeg"]
