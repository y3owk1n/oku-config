[package]
name = "luarocks"
description = "Package manager for Lua modules, set up for Lua 5.1"
homepage = "https://luarocks.org"
license = "MIT"

# The tags name the versions, and the archive comes from luarocks.org.
[version]
from = "git-tags"
repo = "https://github.com/luarocks/luarocks"
strip_prefix = "v"

# What the build needs of the machine, which oku checks and does not install.
# The Command Line Tools give macOS its compiler, make and git. On Linux
# bootstrap/linux.sh installs these packages.
[host]
xcode-clt = { path = "/Library/Developer/CommandLineTools/usr/bin/clang", install = "xcode-select --install", when = { os = "darwin" } }
make = { command = "make", apt = "build-essential", dnf = "make", pacman = "base-devel", when = { os = "linux" } }

[build]
needs = ["make"]
source = { url = "https://luarocks.org/releases/luarocks-{{version}}.tar.gz", strip = 1 }
deps = ["./lua.toml"]

# The luarocks script starts the lua it was configured with.
[runtime]
deps = ["./lua.toml"]

[[build.step]]
run = "./configure --prefix={{prefix}} --sysconfdir={{prefix}}/etc --with-lua={{dep.lua.prefix}} && make && make install"
shell = "sh"
