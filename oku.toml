# My machines, described for oku. `oku sync` applies this file and the lists it
# includes. Nothing here needs root. What does is in bootstrap/.

include = [
	"./lists/packages.toml", # every shared package and font
	"./lists/apps.toml",     # desktop apps that are not macOS-only
	"./lists/files.toml",    # program configs, templates and the SSH key
	"./lists/ai.toml",       # agent skills and instructions
	# What one OS alone gets. Nothing inside these needs a when of its own.
	{ ref = "./lists/darwin.toml", when = { os = "darwin" } },
	{ ref = "./lists/linux.toml", when = { os = "linux" } },
	{ ref = "./lists/windows.toml", when = { os = "windows" } },
]

# oku.lock pins every package for these platforms besides the machine that
# runs oku, so a Linux machine installs from the lock that the Mac wrote.
[lock]
platforms = ["darwin-arm64", "linux-arm64-glibc", "linux-amd64-glibc"]

# The node that the npm packages run through. A machine that adopts this repo
# with `oku sync github:y3owk1n/oku-config` reads it from here too.
[runtimes]
node = { ref = "./packages/node.toml", version = "^22" }
python = "./packages/python.toml"
go = "./packages/go.toml"
rust = "./packages/rust.toml"

# Values that the templates under files/ use as {{name}}.
[vars]
name = "Kyle Wong"
email = "62775956+y3owk1n@users.noreply.github.com"
githubuser = "y3owk1n"
sshpubkey = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINE+DcJD2D/tw74/b0mh4E+rnZNSLqCYHB5igImNo6Ol"
font = "JetBrainsMono Nerd Font Propo"

# Forest Ink, my base16 scheme. Hex without the leading #. Change a colour here
# and `oku sync` renders every themed config again, in one generation.
[vars.theme]
base00 = "0c1410"
base01 = "162119"
base02 = "1f3025"
base03 = "445c48"
base04 = "7a9e7e"
base05 = "c2d6ba"
base06 = "daecd2"
base07 = "eef7e8"
base08 = "e06c75"
base09 = "d09040"
base0A = "c8b860"
base0B = "7ec688"
base0C = "5ab5a0"
base0D = "6aadcf"
base0E = "c595d4"
base0F = "bf8a6e"

# Variables for every shell and for oku exec. Fish's own startup values, such
# as the XDG folders, the locale and TERM, stay in files/fish/config.fish.
[env]
EDITOR = "fude"
VISUAL = "fude"
GIT_EDITOR = "fude"
PAGER = "less"
LESS = "-R"
CLICOLOR = "1"
COLORTERM = "truecolor"
TERMINAL = "ghostty"
KEYTIMEOUT = "1"
SYSTEMD_COLORS = "true"

[packages]
