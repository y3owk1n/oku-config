# What macOS alone gets. ../oku.toml includes this list under
# when = { os = "darwin" }, so no entry here needs a when of its own.
# The defaults tables are in macos.toml.

include = ["./macos.toml"]

# The source builds need the Command Line Tools. macOS ships git, ssh, python3
# and less, and git and python3 run from the Command Line Tools.
[host]
xcode-clt = { path = "/Library/Developer/CommandLineTools/usr/bin/clang", install = "xcode-select --install" }

# neru's exec_shell and its one argument, for files/neru/config.toml.tmpl.
[vars]
neru-shell = "/bin/dash"
neru-shell-arg = "-lc"

[packages]

# apps. orbstack and whatsapp have no Linux build.
affinity = "../packages/affinity.toml"
orbstack = "../packages/orbstack.toml"
utm = "../packages/utm.toml"
whatsapp = "../packages/whatsapp.toml"
# virtualbuddy = "../packages/virtualbuddy.toml"

# window management and keys
mimi = { ref = "github:y3owk1n/mimi#mimi-main", service = true }
skhd = { ref = "../packages/skhd.toml", service = true }

# cli, built from source. Linux has these as its own tools.
coreutils = "../packages/coreutils.toml" # every program has a g prefix, such as gls
mole = "../packages/mole.toml"

# System scope, applied by `oku sync --system`: Tailscale, and the Karabiner
# driver and daemon that kanata needs.
tailscale-app = { ref = "../packages/tailscale.toml", system = true }
karabiner-driver = { ref = "../packages/karabiner-driver.toml", service = true, system = true, run_as = "root" }

[files]
"{{config}}/kanata" = { link = "../files/kanata" }

# Included from the main git and ssh configs, which skip a missing include.
"{{config}}/git/config-darwin" = { link = "../files/git/config-darwin" }
"{{home}}/.ssh/config-darwin" = { link = "../files/ssh/config-darwin" }

"{{config}}/mimi/config.toml" = { render = "../files/mimi/config.toml.tmpl" }
"{{config}}/mimi/tiling" = { link = "../files/mimi/tiling" }
"{{config}}/skhd/skhdrc" = { link = "../files/skhd/skhdrc" }

# docker finds `docker compose` and `docker buildx` here.
"{{home}}/.docker/cli-plugins/docker-buildx" = { link = "{{pkg.orbstack}}/OrbStack.app/Contents/MacOS/xbin/docker-buildx" }
"{{home}}/.docker/cli-plugins/docker-compose" = { link = "{{pkg.orbstack}}/OrbStack.app/Contents/MacOS/xbin/docker-compose" }
