# Every package and font that more than one OS gets. What macOS alone gets is
# in darwin.toml.
# A ref that starts with ../packages/ is a manifest in this repo. A github: ref
# with no #name has no manifest, oku infers one from the newest release.
#
# Some manifests build from source, the way their Homebrew formulae do it, and
# say so at their top. They need the Command Line Tools on macOS, and the
# packages of bootstrap/linux.sh on Linux. Their libraries (cmake, lz4, libpng,
# jpeg-turbo, libuv, json-c, libwebsockets and others) are deps only, so they
# are not listed.

[packages]

# cli
ast-grep = "../packages/ast-grep.toml"
bat = "../packages/bat.toml"
btop = "../packages/btop.toml" # the static program of the release on Linux, the source needs C++23
eza = "../packages/eza.toml"
fd = "../packages/fd.toml"
fzf = "github:junegunn/fzf"
jq = "github:jqlang/jq"
mkcert = "github:FiloSottile/mkcert"
rip2 = "../packages/rip2.toml" # the program is rip
ripgrep = "../packages/ripgrep.toml"
stripe-cli = "github:stripe/stripe-cli" # the program is stripe
ttyd = "../packages/ttyd.toml" # for vhs. Built from source on macOS alone, upstream builds no macOS one
vhs = "../packages/vhs.toml" # runs ttyd and ffmpeg

# compression
brotli = "../packages/brotli.toml"
xz = "../packages/xz.toml"
zstd = "../packages/zstd.toml" # brings lz4 as a dep

# images
gifsicle = "../packages/gifsicle.toml"
imagemagick = "../packages/imagemagick.toml" # zlib, bzip2 and expat come from the system on Linux
jpegoptim = "../packages/jpegoptim.toml"
libwebp = "../packages/libwebp.toml" # cwebp and dwebp
optipng = "../packages/optipng.toml"
pngquant = "../packages/pngquant.toml"

# documents
ghostscript = "../packages/ghostscript.toml" # the program is gs
poppler = "../packages/poppler.toml" # pdftoppm and pdftotext

# media tools for uts
ffmpeg = "../packages/ffmpeg.toml"
ffprobe = "../packages/ffprobe.toml"

# shell
atuin = { ref = "../packages/atuin.toml", service = true }
fish = "../packages/fish.toml"
sesh = "../packages/sesh.toml"
starship = "../packages/starship.toml"
tmux = "../packages/tmux.toml"
zoxide = "../packages/zoxide.toml"

# git
difftastic = "github:Wilfred/difftastic" # the program is difft
gh = "../packages/gh.toml"
git-lfs = "github:git-lfs/git-lfs"
lazygit = "../packages/lazygit.toml"

# editors and language servers
# The npm: packages run on the node that ../oku.toml names under [runtimes].
nvim = "../packages/nvim.toml"
tree-sitter = "../packages/tree-sitter.toml"
marksman = "../packages/marksman.toml"
gh-actions-language-server = "../packages/gh-action-language-server.toml"
bash-language-server = "npm:bash-language-server"
fish-lsp = "npm:fish-lsp"
prettierd = "npm:@fsouza/prettierd"
vscode-langservers-extracted = "npm:vscode-langservers-extracted"
yaml-language-server = "npm:yaml-language-server"
# lua 5.1 for Neovim plugins
lua = "../packages/lua.toml"
luarocks = "../packages/luarocks.toml"

# security
age = "github:FiloSottile/age" # age, age-keygen and the plugins
sops = "github:getsops/sops"

# terminal
ghostty = "../packages/ghostty.toml"

# coding agents
claude-code = "../packages/claude-code.toml"
freebuff = "../packages/freebuff.toml"
opencode = "../packages/opencode.toml"

# keyboard remapper, which upstream builds for x86-64 Linux only
kanata = { ref = "../packages/kanata.toml", when = [{ os = "darwin" }, { os = "linux", arch = "amd64" }] }

# fonts
jetbrains-mono-nerd-font = "../packages/jetbrains-mono-nerd-font.toml"
poppins = "../packages/poppins.toml"
symbols-nerd-font = "../packages/symbols-nerd-font.toml"

# my own tools
neru = { ref = "github:y3owk1n/neru#neru-main", service = true }
uts = "github:y3owk1n/uts#uts-main"
friendly = "github:friendly-social-ai/cli"
