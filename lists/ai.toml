# Agent skills, the global instructions file and the quick agent.
# The steps to add or update a skill: ../files/skills/add-skill/SKILL.md

[packages]
# External skill repos, each pinned to one commit. The [files] entries below
# link single skill directories out of them with {{pkg.<name>}}.
skills-anthropic = "../packages/skills-anthropic.toml"
skills-caveman = "../packages/skills-caveman.toml"
skills-cursor = "../packages/skills-cursor.toml"
skills-emil = "../packages/skills-emil.toml"
skills-shadcn = "../packages/skills-shadcn.toml"

[files]
# Both files are links, so an edit in files/claude/ shows at once.
"{{home}}/.claude/CLAUDE.md" = { link = "../files/claude/CLAUDE.md" }
"{{home}}/.claude/agents/quick.md" = { link = "../files/claude/agents/quick.md" }

# Each skill goes to ~/.claude/skills, and through `also` to ~/.agents/skills
# and ~/.config/opencode/skills.

# local skills from files/skills/
"{{home}}/.claude/skills/add-skill" = { link = "../files/skills/add-skill", also = ["{{home}}/.agents/skills/add-skill", "{{config}}/opencode/skills/add-skill"] }
"{{home}}/.claude/skills/diagnose" = { link = "../files/skills/diagnose", also = ["{{home}}/.agents/skills/diagnose", "{{config}}/opencode/skills/diagnose"] }
"{{home}}/.claude/skills/find-skills" = { link = "../files/skills/find-skills", also = ["{{home}}/.agents/skills/find-skills", "{{config}}/opencode/skills/find-skills"] }
"{{home}}/.claude/skills/grill" = { link = "../files/skills/grill", also = ["{{home}}/.agents/skills/grill", "{{config}}/opencode/skills/grill"] }
"{{home}}/.claude/skills/implement" = { link = "../files/skills/implement", also = ["{{home}}/.agents/skills/implement", "{{config}}/opencode/skills/implement"] }
"{{home}}/.claude/skills/improve-codebase-architecture" = { link = "../files/skills/improve-codebase-architecture", also = ["{{home}}/.agents/skills/improve-codebase-architecture", "{{config}}/opencode/skills/improve-codebase-architecture"] }
"{{home}}/.claude/skills/pr" = { link = "../files/skills/pr", also = ["{{home}}/.agents/skills/pr", "{{config}}/opencode/skills/pr"] }
"{{home}}/.claude/skills/prd" = { link = "../files/skills/prd", also = ["{{home}}/.agents/skills/prd", "{{config}}/opencode/skills/prd"] }
"{{home}}/.claude/skills/research" = { link = "../files/skills/research", also = ["{{home}}/.agents/skills/research", "{{config}}/opencode/skills/research"] }
"{{home}}/.claude/skills/review" = { link = "../files/skills/review", also = ["{{home}}/.agents/skills/review", "{{config}}/opencode/skills/review"] }
"{{home}}/.claude/skills/ship" = { link = "../files/skills/ship", also = ["{{home}}/.agents/skills/ship", "{{config}}/opencode/skills/ship"] }
"{{home}}/.claude/skills/spec" = { link = "../files/skills/spec", also = ["{{home}}/.agents/skills/spec", "{{config}}/opencode/skills/spec"] }
"{{home}}/.claude/skills/triage" = { link = "../files/skills/triage", also = ["{{home}}/.agents/skills/triage", "{{config}}/opencode/skills/triage"] }
