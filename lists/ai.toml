"{{home}}/.claude/skills/anthropic_frontend-design" = { link = "{{pkg.skills-anthropic}}/skills/frontend-design", also = ["{{home}}/.agents/skills/anthropic_frontend-design", "{{config}}/opencode/skills/anthropic_frontend-design"] }
