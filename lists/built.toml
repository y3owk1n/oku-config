# Tools that oku builds from source, each proven on macOS arm64 with the Xcode
# command line tools. The libraries they use (cmake, lz4, libpng, jpeg-turbo)
# have manifests in ../packages/ and are deps only, so they are not listed.
# They also build on Debian 12 and Fedora 44, arm64, with the packages of
# bootstrap/linux.sh.
# btop takes the static program of its release on Linux, because the source
# needs a C++23 compiler.

[packages]

# images
gifsicle = "../packages/gifsicle.toml"
optipng = "../packages/optipng.toml"
jpegoptim = "../packages/jpegoptim.toml"
ghostscript = "../packages/ghostscript.toml" # the program is gs

# compression
brotli = "../packages/brotli.toml"
xz = "../packages/xz.toml"
zstd = "../packages/zstd.toml" # brings lz4 as a dep

# lua 5.1 for Neovim plugins
lua = "../packages/lua.toml"
luarocks = "../packages/luarocks.toml"

# cli
# Linux has these as its own tools, so the g-prefixed copy is for macOS alone.
coreutils = { ref = "../packages/coreutils.toml", when = { os = "darwin" } } # every program has a g prefix, such as gls
btop = "../packages/btop.toml"
mole = { ref = "../packages/mole.toml", when = { os = "darwin" } }
