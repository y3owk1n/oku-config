# Entries that share a target with files.toml and differ by OS. TOML allows a
# key once per table, so the second entry for a target lives here.

[files]
"{{config}}/neru/config.toml" = { render = "../files/neru/config.toml.tmpl", when = { os = "linux" }, vars = { neru-shell = "/bin/sh", neru-shell-arg = "-lc" } }

# ghostty loads the host's mesa through this, see packages/ghostty.toml.
"{{config}}/ghostty/egl-mesa.json" = { link = "../files/ghostty/egl-mesa.json", when = { os = "linux" } }
